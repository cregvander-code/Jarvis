<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>J.A.R.V.I.S.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #050a14; color: #00e5ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-shadow: 0 0 5px #00e5ff; }
        .hologram { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
        .ring { position: absolute; border: 2px solid rgba(0, 229, 255, 0.3); border-radius: 50%; animation: spin 10s linear infinite; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.2); }
        .ring:nth-child(1) { width: 100%; height: 100%; border-top: 2px solid #00e5ff; animation-direction: reverse; }
        .ring:nth-child(2) { width: 75%; height: 75%; border-left: 2px solid #00e5ff; animation-duration: 7s; }
        .ring:nth-child(3) { width: 50%; height: 50%; border-bottom: 2px solid #00e5ff; animation-duration: 4s; }
        .core { width: 30%; height: 30%; background: radial-gradient(circle, #00e5ff 0%, transparent 70%); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .title { font-size: 24px; letter-spacing: 5px; margin-bottom: 40px; font-weight: 300; text-transform: uppercase; }
        .buttons { display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 300px; z-index: 10; }
        .btn { background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; padding: 15px; border-radius: 8px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; text-align: center; transition: all 0.3s; box-shadow: 0 0 10px rgba(0, 229, 255, 0.1); cursor: pointer; }
        .btn:active { background: rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="hologram">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core"></div>
    </div>

    <div class="title">J.A.R.V.I.S.</div>

    <div class="buttons">
        <a href="shortcuts://run-shortcut?name=JARVIS%20--%20Question" class="btn">Poser une question</a>
        <a href="shortcuts://run-shortcut?name=JARVIS%20%E2%80%94%20Lecture" class="btn">Lire la réponse</a>
    </div>

</body>
</html>
